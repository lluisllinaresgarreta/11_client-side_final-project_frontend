name: Lint Code Base
on:
    push:
        branches:
            - "**"
            - "!main"
    pull_request:
        branches:
            - "**"

jobs:
    lint:
        name: Linting
        runs-on: ubuntu-22.04
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 18
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Run ESLint
              run: npm run lint

          #  - name: Run tests
          #    run: npm run test:run

            - name: Cache node modules
              uses: actions/cache@v3
              with:
                  path: |
                      ~/.npm
                      node_modules
                  key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}