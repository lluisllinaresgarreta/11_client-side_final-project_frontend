name: test

on: 
  pull_request:
    branches: [main]
    types: [opened, synchronize]
  push:
      branches: [main]
jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - name: checkcout
        uses: actions/checkout@v4
      - name: install Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: install dependencies
        run: npm install
      - name: execute
        run: npm test
  lint:
    runs-on: ubuntu-22.04
    steps:
      - name: checkcout
        uses: actions/checkout@v4
      - name: install Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: install dependencies
        run: npm install
      - name: execute
        run: npm run lint